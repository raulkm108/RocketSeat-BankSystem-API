repos:
  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: ./venv/Scripts/python.exe -m pylint
        language: system
        types: [python]
        args:
          - "-rn"
          - "-sn"
          - "--rcfile=.pylintrc"
          - "--load-plugins=pylint.extensions.docparams"